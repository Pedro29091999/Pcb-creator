name: Generate and Build PCB App APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  generate-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        # cache: 'gradle'  <-- Removed to prevent checking for files that don't exist yet

    - name: Run Python Script to Scaffold Android App
      run: |
        python create_pcb_app.py

    - name: Grant execute permission for Gradle wrapper
      run: chmod +x gradlew || true

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pcb-generator-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
